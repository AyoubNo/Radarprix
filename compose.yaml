services:
  api:
    build:
      context: .
    image: radarprix-api
    container_name: radarprix-api
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PRIXRADAR_SITE_URL: ${PRIXRADAR_SITE_URL:?Set PRIXRADAR_SITE_URL}
      PRIXRADAR_REFRESH_SECRET: ${PRIXRADAR_REFRESH_SECRET:?Set PRIXRADAR_REFRESH_SECRET}
      PRIXRADAR_DATA_DIR: /data
      PRIXRADAR_API_HOST: 0.0.0.0
      PRIXRADAR_API_PORT: 3500
      PRIXRADAR_STARTUP_COLLECTION: "true"
      CHROMIUM_PATH: /usr/bin/chromium
    ports:
      - "3500:3500"
    volumes:
      - radarprix-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3500/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  radarprix-data:
